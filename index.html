<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="description" content="拾词 · 一个白色主题的四六级单词本。拍照识词、联网查词、语境测验，并按艾宾浩斯遗忘曲线安排复习。">
  <title>拾词 · 四六级单词本</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231e6b52'/%3E%3Cpath d='M18 38c0-13 12-22 28-22 0 15-8 27-22 27' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M17 48c5-11 13-18 24-23' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20261126k">
  <style>
    .boot-error-wrap { max-width: 560px; margin: 8vh auto; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #20302a; line-height: 1.65; }
    .boot-error-wrap h1 { margin: 0 0 10px; font-size: 22px; }
    .boot-error-wrap p { margin: 0 0 14px; color: #66736d; font-size: 14px; }
    .boot-error-wrap pre { margin: 14px 0; padding: 13px; border: 1px solid #e5e9e4; border-radius: 10px; background: #f7f8f4; color: #9b3d32; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .boot-error-wrap a { display: inline-block; margin-top: 6px; padding: 10px 16px; border-radius: 999px; background: #1e6b52; color: #fff; text-decoration: none; font-size: 14px; }
  </style>
  <script>
    (function () {
      function showBootError(title, detail) {
        var app = document.getElementById("app");
        if (!app || app.querySelector(".boot-error-wrap")) return;
        var booting = app.querySelector(".boot-splash") || !app.children.length;
        if (!booting) return;
        app.innerHTML = "";
        var box = document.createElement("div");
        box.className = "boot-error-wrap";
        var h = document.createElement("h1");
        h.textContent = title;
        var p = document.createElement("p");
        p.textContent = "请把下面的文字发给制作人；也可以先试试「启动单词本.bat」打开。";
        var pre = document.createElement("pre");
        pre.textContent = detail || "页面脚本没有启动。";
        var a = document.createElement("a");
        a.href = "index.html";
        a.textContent = "重新加载";
        box.appendChild(h);
        box.appendChild(p);
        box.appendChild(pre);
        box.appendChild(a);
        app.appendChild(box);
      }
      window.addEventListener("error", function (event) {
        if (event && event.message) showBootError("页面启动出错", event.message + "\n" + (event.filename || "") + ":" + (event.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        showBootError("页面启动出错", reason && reason.message ? reason.message : String(reason || "未知错误"));
      });
      window.addEventListener("load", function () {
        setTimeout(function () {
          var app = document.getElementById("app");
          if (app && (!app.children.length || app.querySelector(".boot-splash"))) {
            showBootError("页面没有加载出来", "脚本可能被浏览器拦截，或文件路径不正确。\n当前地址：" + location.href);
          }
        }, 2500);
      });
    })();
  </script>
</head>
<body>
  <div id="app" class="app-root">
    <div class="boot-splash" style="min-height:100vh;display:grid;place-items:center;background:#f7f8f4;color:#20302a;font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
      <div style="text-align:center">
        <div style="width:54px;height:54px;margin:0 auto 16px;display:grid;place-items:center;border-radius:15px;background:#1e6b52;color:#fff;font-size:26px">拾</div>
        <strong style="display:block;font-size:18px">正在打开拾词…</strong>
        <span style="display:block;margin-top:8px;color:#7a8780;font-size:13px">如果长时间停在这里，请回到文件夹双击「启动单词本.bat」。</span>
      </div>
    </div>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div style="padding:40px;font-family:system-ui,sans-serif;text-align:center">
      拾词需要开启 JavaScript 才能使用。
    </div>
  </noscript>

  <script src="js/data.js?v=20261126k" defer></script>
  <script src="js/my-words.js?v=20261126k" defer></script>
  <script src="js/store.js?v=20261126k" defer></script>
  <script src="js/api.js?v=20261126k" defer></script>
  <script src="js/app.js?v=20261126k" defer></script>
</body>
</html>
